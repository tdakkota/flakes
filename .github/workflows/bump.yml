name: Bump versions

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - grok
          - codex
          - claude-code
          - vibe
          - vibe-acp
          - copilot
          - opencode
          - kimi
          - claude-desktop
          - proton-pass
          - throne
    concurrency:
      group: bump-${{ matrix.package }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Check upstream feeds and regenerate versions.nix
        working-directory: tools/bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.package }}
        run: go run . -only "$PACKAGE" -write

      - name: Regenerate PKGBUILDs
        run: nix run .#gen-pkgbuilds

      - name: Validate updated flake
        run: nix flake check --no-build

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "build(${{ matrix.package }}): update pinned version"
          title: "build(${{ matrix.package }}): update pinned version"
          body: |
            @tdakkota, an upstream update for `${{ matrix.package }}` is ready for review.

            Generated by `tools/bump` from the upstream release feed, including
            download URLs and checksums. Generated PKGBUILDs were refreshed and
            `nix flake check --no-build` passed.

            [Update job logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          assignees: tdakkota
          reviewers: tdakkota
          branch: auto/bump-${{ matrix.package }}
          delete-branch: true
          add-paths: |
            versions.nix
            pkgbuilds/
