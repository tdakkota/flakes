name: Bump versions

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: bump-versions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Check upstream feeds and regenerate versions.nix
        id: bump
        continue-on-error: true
        working-directory: tools/bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run . -write

      - name: Regenerate PKGBUILDs
        run: nix run .#gen-pkgbuilds

      - name: Validate updated flake
        run: nix flake check --no-build

      - name: Check for package changes
        id: changes
        run: |
          if git diff --quiet -- versions.nix pkgbuilds/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.bump.outcome == 'success' || steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "build(packages): update pinned versions"
          title: "build(packages): update pinned versions"
          body: |
            @tdakkota, upstream package updates are ready for review.

            Generated by `tools/bump` from the upstream release feeds, including
            download URLs and checksums. Generated PKGBUILDs were refreshed and
            `nix flake check --no-build` passed.

            This PR is refreshed by subsequent runs until it is merged.
            Upstream check result: `${{ steps.bump.outcome }}`. Successful updates
            are included even if another package could not be updated.

            [Update job logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          assignees: tdakkota
          reviewers: tdakkota
          branch: auto/bump-versions
          delete-branch: true
          add-paths: |
            versions.nix
            pkgbuilds/

      - name: Report upstream failures
        if: always() && steps.bump.outcome == 'failure'
        run: |
          echo "::error::One or more package updates failed; see the upstream check logs."
          exit 1
