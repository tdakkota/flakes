name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: disabled
          use-gha-cache: enabled

      # --no-build: evaluate only, don't download/build every package's
      # (sometimes 100MB+) artifact on every push.
      - name: nix flake check
        run: nix flake check --no-build

      - name: nixfmt --check
        run: nix run nixpkgs#nixfmt -- --check flake.nix versions.nix nix/*.nix packages/throne/*.nix

      - name: PKGBUILD syntax
        run: |
          for recipe in pkgbuilds/*/PKGBUILD packages/throne/PKGBUILD; do
            bash -n "$recipe"
          done

      - name: TUN polkit rule tests
        run: node --test packages/throne/polkit.test.cjs

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/bump
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: tools/bump/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi
